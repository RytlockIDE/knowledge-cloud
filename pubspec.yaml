name: knowledge_cloud
description: "知识云 - 面向学生的混合算力知识专家系统"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 数据层
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # 网络
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # 图可视化
  flutter_force_directed_graph: ^1.0.6

  # UI
  flutter_markdown: ^0.7.6
  google_fonts: ^6.2.1

  # 桌面与系统
  window_manager: ^0.4.3
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.2

  # 工具
  uuid: ^4.5.1
  intl: ^0.20.0
  collection: ^1.18.0
  logger: ^2.5.0
  shared_preferences: ^2.3.3
  pdfrx: ^2.6.1
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13
  msix: ^3.16.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

msix_config:
  display_name: 知识云
  publisher_display_name: KnowledgeCloud
  identity_name: com.knowledgecloud.knowledgecloud
  msix_version: 1.0.0.0
  logo_path: assets/icons/app_icon.png
  capabilities: internetClient
  architecture: x64

flutter_launcher_icons:
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
