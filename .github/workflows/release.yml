name: 三平台安装包构建

# 触发方式：
#   1) 推送版本标签：git tag v1.0.0 && git push origin v1.0.0
#   2) GitHub 仓库 Actions 页面手动点击「Run workflow」
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译一键安装程序
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\knowledge_cloud.iss'
        shell: pwsh

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 知识云-Windows-安装包
          path: installers/Output/*.exe

  build-macos:
    name: macOS 安装包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 一键打包 DMG
        run: bash scripts/build_macos.sh

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 知识云-macOS-安装包
          path: installers/*.dmg

  build-linux:
    name: Linux 安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev file dpkg-dev curl libsecret-1-dev

      - name: 获取依赖
        run: flutter pub get

      - name: 一键打包 DEB / AppImage
        run: bash scripts/build_linux.sh

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 知识云-Linux-安装包
          path: |
            installers/*.deb
            installers/*.AppImage

  # 标签发布时：将全部安装包附到 GitHub Release
  publish-release:
    name: 发布 GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 附加安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
